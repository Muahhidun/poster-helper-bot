{% extends "base.html" %}

{% block title %}Закуп — PizzBurg{% endblock %}

{% block content %}
<style>
    .purchase-container {
        max-width: 600px;
        margin: 0 auto;
    }
    .supplier-card {
        background: var(--bg-elevated);
        border: 1px solid var(--border-light);
        border-radius: var(--radius-xl);
        box-shadow: var(--shadow-sm);
        margin-bottom: 24px;
        overflow: hidden;
    }
    .supplier-header {
        background: rgba(37, 99, 235, 0.03);
        padding: 16px 20px;
        border-bottom: 1px solid var(--border-light);
    }
    .ingredient-row {
        padding: 16px 20px;
        border-bottom: 1px solid var(--border-light);
        transition: background-color var(--transition-fast);
    }
    .ingredient-row:hover {
        background-color: rgba(0, 0, 0, 0.01);
    }
    .ingredient-row:last-child {
        border-bottom: none;
    }
    .badge-today {
        background: var(--accent-green-light);
        color: var(--accent-green-dark);
        font-size: 11px;
        font-weight: 600;
        padding: 4px 10px;
        border-radius: var(--radius-full);
    }
    .badge-regular {
        background: var(--accent-primary-light);
        color: var(--accent-primary);
        font-size: 11px;
        font-weight: 600;
        padding: 4px 10px;
        border-radius: var(--radius-full);
    }
    .qty-display {
        font-weight: 700;
        font-size: 15px;
    }
    .qty-active {
        color: var(--accent-primary);
    }
    .qty-inactive {
        color: var(--text-muted);
    }
    .stock-input-group {
        width: 140px;
    }
    .stock-input-group input {
        text-align: center;
        font-weight: 700;
        font-size: 13px;
        border-left: none;
        border-right: none;
    }
    .stock-input-group button {
        border-color: var(--border-color);
        background: var(--bg-secondary);
        color: var(--text-secondary);
        padding: 4px 10px;
    }
    .stock-input-group button:hover {
        background: var(--bg-hover);
    }
</style>

<div class="purchase-container py-2">
    <!-- Date selector card -->
    <div class="card p-4 mb-4">
        <div class="d-flex align-items-center justify-content-between mb-3">
            <h4 class="m-0 font-bold d-flex align-items-center gap-2">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/></svg>
                Лист закупа
            </h4>
            <button id="btn-refresh" class="btn btn-light btn-sm rounded-circle p-2" onclick="refreshBlank()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 11-.57-8.38l5.67-5.67"/></svg>
            </button>
        </div>

        <div class="d-flex align-items-center justify-content-between gap-2">
            <button class="btn btn-light btn-sm px-3 py-2" onclick="adjustDate(-1)">Вчера</button>
            
            <div class="d-flex align-items-center gap-2 bg-light border rounded-pill px-3 py-2 flex-grow-1 justify-content-center">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                <input type="date" id="purchase-date" class="bg-transparent border-0 font-bold text-center outline-none" style="width: 130px; font-size: 14px;" onchange="onDateChanged()">
            </div>
            
            <button class="btn btn-light btn-sm px-3 py-2" onclick="adjustDate(1)">Завтра</button>
        </div>
        
        <div id="weekday-subtitle" class="text-center text-muted mt-2 small" style="display:none;"></div>
    </div>

    <!-- Content area -->
    <div id="loading-spinner" class="text-center py-5">
        <div class="spinner-border text-primary" role="status"></div>
        <div class="text-muted mt-2 small">Загрузка данных бланка...</div>
    </div>
    
    <div id="error-message" class="alert alert-danger" style="display:none;"></div>
    
    <div id="purchase-content" style="display:none;"></div>
</div>

<script>
    let currentData = null;

    document.addEventListener('DOMContentLoaded', function() {
        // Set today's date initially
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('purchase-date').value = today;
        loadBlank(today);
    });

    function loadBlank(dateStr) {
        showLoading(true);
        hideError();
        
        fetch(`/api/purchase/blank?date=${dateStr}`)
            .then(res => {
                if (!res.ok) throw new Error('Ошибка сервера при загрузке бланка');
                return res.json();
            })
            .then(data => {
                currentData = data;
                renderContent(data);
                showLoading(false);
            })
            .catch(err => {
                console.error(err);
                showError(err.message || 'Не удалось загрузить бланк закупа');
                showLoading(false);
            });
    }

    function refreshBlank() {
        const dateStr = document.getElementById('purchase-date').value;
        loadBlank(dateStr);
    }

    function onDateChanged() {
        const dateStr = document.getElementById('purchase-date').value;
        loadBlank(dateStr);
    }

    function adjustDate(days) {
        const dateInput = document.getElementById('purchase-date');
        const current = new Date(dateInput.value);
        current.setDate(current.getDate() + days);
        const newDateStr = current.toISOString().split('T')[0];
        dateInput.value = newDateStr;
        loadBlank(newDateStr);
    }

    function showLoading(show) {
        document.getElementById('loading-spinner').style.display = show ? 'block' : 'none';
        document.getElementById('purchase-content').style.display = show ? 'none' : 'block';
    }

    function showError(msg) {
        const errDiv = document.getElementById('error-message');
        errDiv.textContent = msg;
        errDiv.style.display = 'block';
        document.getElementById('purchase-content').style.display = 'none';
    }

    function hideError() {
        document.getElementById('error-message').style.display = 'none';
    }

    const weekdays = ['Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота', 'Воскресенье'];

    function renderContent(data) {
        const contentDiv = document.getElementById('purchase-content');
        contentDiv.innerHTML = '';
        
        // Show weekday subtitle
        const subtitle = document.getElementById('weekday-subtitle');
        subtitle.textContent = `Действует расписание на ${weekdays[data.weekday]}`;
        subtitle.style.display = 'block';

        if (!data.suppliers || data.suppliers.length === 0) {
            contentDiv.innerHTML = `
                <div class="card text-center py-5">
                    <div style="font-size: 40px; margin-bottom: 12px;">🛒</div>
                    <div class="text-muted italic">На этот день закупки не запланированы.</div>
                </div>
            `;
            return;
        }

        data.suppliers.forEach(supplier => {
            const card = document.createElement('div');
            card.className = 'supplier-card';
            
            // Header
            let badgeHtml = '';
            if (supplier.is_order_day) {
                badgeHtml = '<span class="badge-today">Сегодня день заказа</span>';
            } else if (supplier.cover_days > 0) {
                badgeHtml = `<span class="badge-regular">Покрытие: ${supplier.cover_days} дн.</span>`;
            } else {
                badgeHtml = '<span class="badge-regular text-muted bg-light">Внеплановый закуп</span>';
            }
            
            let coverText = supplier.cover_days > 0 
                ? `Покрытие закупа на: <b>${supplier.cover_days} дн.</b>` 
                : 'Внеплановый закуп';
            
            card.innerHTML = `
                <div class="supplier-header d-flex justify-content-between align-items-center">
                    <div>
                        <h5 class="m-0 font-bold">${supplier.name}</h5>
                        <small class="text-muted d-block mt-0.5">${coverText}</small>
                    </div>
                    ${badgeHtml}
                </div>
                <div class="ingredients-list divide-y" id="list-sup-${supplier.id}"></div>
            `;
            
            const listDiv = card.querySelector(`#list-sup-${supplier.id}`);
            
            supplier.ingredients.forEach(ing => {
                const row = document.createElement('div');
                row.className = 'ingredient-row d-flex flex-column gap-2';
                row.dataset.ingId = ing.id;
                
                // Pre-fill actual stock from current_stock or default to 0
                const currentStockVal = ing.current_stock !== undefined && ing.current_stock !== null ? ing.current_stock : 0;
                const actualStockVal = currentStockVal;
                const orderQtyVal = Math.max(0, Number((ing.target_stock - actualStockVal).toFixed(2)));
                
                // Track state locally in attributes
                row.dataset.target = ing.target_stock;
                row.dataset.actual = actualStockVal;
                
                let detailsText = `Цель: <b>${ing.target_stock}</b>`;
                if (ing.avg_daily_consumption > 0) {
                    detailsText += ` <span class="text-muted mx-1">|</span> Расход: ${ing.avg_daily_consumption}/дн`;
                }
                if (ing.current_stock !== undefined) {
                    detailsText += ` <span class="text-muted mx-1">|</span> В постере: ${ing.current_stock}`;
                }
                
                row.innerHTML = `
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <div class="d-flex align-items-center gap-2 flex-wrap">
                                <h6 class="m-0 font-semibold" style="font-size: 14px;">${ing.name}</h6>
                                <button class="btn btn-link p-0 text-decoration-none text-muted" style="font-size: 11px; line-height: 1;" onclick="openLinkModal(${ing.id}, '${ing.name.replace(/'/g, "\\'")}', ${ing.poster_ingredient_id || 0})">
                                    ${ing.poster_ingredient_id ? '✏️' : '<span class="text-danger" style="font-size: 10px; font-weight:600;">🔗 Связать</span>'}
                                </button>
                            </div>
                            <span class="text-muted small mt-0.5 d-block" style="font-size: 11px;">
                                ${detailsText}
                            </span>
                        </div>
                        <div class="text-end" style="min-width: 70px;">
                            <span class="text-muted small d-block" style="font-size: 10px; font-weight: 500;">Заказать</span>
                            <span class="qty-display ${orderQtyVal > 0 ? 'qty-active' : 'qty-inactive'}" id="order-qty-${supplier.id}-${ing.id}">
                                ${orderQtyVal}
                            </span>
                        </div>
                    </div>
                    
                    <div class="d-flex align-items-center gap-3 mt-1">
                        <span class="text-muted small font-medium" style="font-size: 12px;">Остаток на складе:</span>
                        
                        <div class="input-group stock-input-group rounded-pill overflow-hidden border">
                            <button class="btn btn-link text-decoration-none border-0" type="button" onclick="adjustIngStock(${supplier.id}, ${ing.id}, -1)">-</button>
                            <input type="text" inputmode="decimal" id="input-${supplier.id}-${ing.id}" class="form-control border-0 py-1" value="${actualStockVal}" oninput="onActualStockInput(${supplier.id}, ${ing.id}, this.value)">
                            <button class="btn btn-link text-decoration-none border-0" type="button" onclick="adjustIngStock(${supplier.id}, ${ing.id}, 1)">+</button>
                        </div>
                    </div>
                `;
                
                listDiv.appendChild(row);
            });
            
            // Append Submit Button inside card body footer
            if (supplier.ingredients.length > 0) {
                const footer = document.createElement('div');
                footer.className = 'p-3 bg-light border-top d-flex justify-content-end';
                footer.innerHTML = `
                    <button class="btn btn-primary w-100 font-semibold py-2.5 rounded-xl d-flex align-items-center justify-content-center gap-2" id="btn-submit-${supplier.id}" onclick="submitSupplierPurchase(${supplier.id})">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                        Сформировать и отправить закуп ${supplier.name}
                    </button>
                `;
                card.appendChild(footer);
            }
            
            contentDiv.appendChild(card);
        });
    }

    function onActualStockInput(supplierId, ingId, val) {
        const row = document.querySelector(`.ingredient-row[data-ing-id="${ingId}"]`);
        if (!row) return;
        
        // Clean value to allow floats
        const cleanVal = val.replace(/[^0-9.]/g, '');
        const actualVal = cleanVal === '' ? 0 : parseFloat(cleanVal) || 0;
        const targetVal = parseFloat(row.dataset.target) || 0;
        
        // Calculate new order qty
        const orderQtyVal = Math.max(0, Number((targetVal - actualVal).toFixed(2)));
        
        row.dataset.actual = cleanVal;
        
        // Update display
        const display = document.getElementById(`order-qty-${supplierId}-${ingId}`);
        display.textContent = orderQtyVal;
        if (orderQtyVal > 0) {
            display.className = 'qty-display qty-active';
        } else {
            display.className = 'qty-display qty-inactive';
        }
    }

    function adjustIngStock(supplierId, ingId, amount) {
        const input = document.getElementById(`input-${supplierId}-${ingId}`);
        if (!input) return;
        
        let current = parseFloat(input.value) || 0;
        let newValue = Math.max(0, current + amount);
        
        // Match integer rounding if fractional is not needed
        if (Number.isInteger(newValue)) {
            input.value = newValue;
        } else {
            input.value = Number(newValue.toFixed(2));
        }
        
        onActualStockInput(supplierId, ingId, input.value);
    }

    function submitSupplierPurchase(supplierId) {
        const supplier = currentData.suppliers.find(s => s.id === supplierId);
        if (!supplier) return;
        
        const submitBtn = document.getElementById(`btn-submit-${supplierId}`);
        const originalHtml = submitBtn.innerHTML;
        
        // Set loading state
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Отправка...';
        
        // Gather items
        const items = [];
        supplier.ingredients.forEach(ing => {
            const input = document.getElementById(`input-${supplierId}-${ing.id}`);
            const actualVal = parseFloat(input.value) || 0;
            const targetVal = ing.target_stock;
            const orderQtyVal = Math.max(0, Number((targetVal - actualVal).toFixed(2)));
            
            items.push({
                name: ing.name,
                target_stock: targetVal,
                actual_stock: actualVal,
                order_qty: orderQtyVal
            });
        });
        
        const payload = {
            date: document.getElementById('purchase-date').value,
            supplier_id: supplierId,
            items: items
        };
        
        fetch('/api/purchase/submit', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(payload)
        })
        .then(res => {
            if (!res.ok) throw new Error('Ошибка сервера при отправке заказа');
            return res.json();
        })
        .then(data => {
            submitBtn.disabled = false;
            submitBtn.innerHTML = originalHtml;
            showToast(`Заказ для ${supplier.name} успешно отправлен в бот!`, 'success');
        })
        .catch(err => {
            console.error(err);
            submitBtn.disabled = false;
            submitBtn.innerHTML = originalHtml;
            showToast(err.message || 'Не удалось отправить закуп', 'error');
        });
    }
</script>

<!-- Modal for Linking Ingredients -->
<div class="modal fade" id="linkModal" tabindex="-1" aria-labelledby="linkModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content" style="background: var(--bg-elevated); border: 1px solid var(--border-light); border-radius: var(--radius-xl);">
      <div class="modal-header border-bottom border-light">
        <h5 class="modal-title font-bold text-lg" id="linkModalLabel">Связать с ингредиентом Poster</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p class="text-muted small mb-3">Выберите соответствующий ингредиент из базы Poster для товара: <strong id="modal-ing-name" class="text-primary"></strong></p>
        
        <div class="mb-3">
          <label for="poster-search" class="form-label font-semibold small text-muted">Поиск по ингредиентам</label>
          <input type="text" id="poster-search" class="form-control mb-2 rounded-lg" placeholder="Начните вводить название..." oninput="filterPosterIngredients(this.value)">
          <select id="poster-select" class="form-select rounded-lg" size="8" style="font-size: 13px;">
            <option value="0">-- Не связывать (отвязать) --</option>
          </select>
        </div>
      </div>
      <div class="modal-footer border-top border-light">
        <button type="button" class="btn btn-light rounded-lg font-semibold" data-bs-dismiss="modal">Отмена</button>
        <button type="button" class="btn btn-primary rounded-lg font-semibold" id="btn-save-link" onclick="saveIngredientLink()">Сохранить</button>
      </div>
    </div>
  </div>
</div>

<script>
    let activeIngId = null;
    let allPosterIngredients = [];
    let linkModalInstance = null;

    function openLinkModal(ingId, ingName, currentPosterId) {
        activeIngId = ingId;
        document.getElementById('modal-ing-name').textContent = ingName;
        document.getElementById('poster-search').value = '';
        
        const select = document.getElementById('poster-select');
        select.innerHTML = '<option value="">Загрузка ингредиентов из Poster...</option>';
        
        // Show modal first
        if (!linkModalInstance) {
            linkModalInstance = new bootstrap.Modal(document.getElementById('linkModal'));
        }
        linkModalInstance.show();
        
        // Fetch if not loaded
        if (allPosterIngredients.length === 0) {
            fetch('/api/purchase/poster-ingredients')
                .then(res => res.json())
                .then(data => {
                    allPosterIngredients = data.ingredients || [];
                    renderPosterSelect(currentPosterId);
                })
                .catch(err => {
                    console.error(err);
                    select.innerHTML = '<option value="">Ошибка загрузки списка</option>';
                });
        } else {
            renderPosterSelect(currentPosterId);
        }
    }

    function renderPosterSelect(selectedId, query = '') {
        const select = document.getElementById('poster-select');
        select.innerHTML = '';
        
        // Add "Unlink" option
        const unlinkOpt = document.createElement('option');
        unlinkOpt.value = '0';
        unlinkOpt.textContent = '-- Не связывать (отвязать) --';
        unlinkOpt.className = 'py-1.5 px-2 font-medium';
        if (selectedId === 0 || !selectedId) {
            unlinkOpt.selected = true;
        }
        select.appendChild(unlinkOpt);
        
        const filtered = allPosterIngredients.filter(ing => 
            ing.name.toLowerCase().includes(query.toLowerCase())
        );
        
        filtered.forEach(ing => {
            const opt = document.createElement('option');
            opt.value = ing.id;
            opt.textContent = `${ing.name} (${ing.unit})`;
            opt.className = 'py-1.5 px-2';
            if (ing.id === selectedId) {
                opt.selected = true;
            }
            select.appendChild(opt);
        });
    }

    function filterPosterIngredients(query) {
        const select = document.getElementById('poster-select');
        const selectedId = parseInt(select.value) || 0;
        renderPosterSelect(selectedId, query);
    }

    function saveIngredientLink() {
        const select = document.getElementById('poster-select');
        const selectedId = parseInt(select.value);
        if (isNaN(selectedId)) {
            showToast('Выберите ингредиент', 'error');
            return;
        }
        
        const saveBtn = document.getElementById('btn-save-link');
        const originalText = saveBtn.textContent;
        saveBtn.disabled = true;
        saveBtn.textContent = 'Сохранение...';
        
        fetch('/api/purchase/link-ingredient', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                ingredient_id: activeIngId,
                poster_ingredient_id: selectedId
            })
        })
        .then(res => {
            if (!res.ok) throw new Error('Ошибка при сохранении связи');
            return res.json();
        })
        .then(data => {
            saveBtn.disabled = false;
            saveBtn.textContent = originalText;
            if (linkModalInstance) {
                linkModalInstance.hide();
            }
            showToast('Связь успешно обновлена!', 'success');
            
            // Reload the purchase sheet to reflect updated name and stocks
            const dateStr = document.getElementById('purchase-date').value;
            loadBlank(dateStr);
        })
        .catch(err => {
            console.error(err);
            saveBtn.disabled = false;
            saveBtn.textContent = originalText;
            showToast(err.message || 'Ошибка сохранения', 'error');
        });
    }
</script>
{% endblock %}
