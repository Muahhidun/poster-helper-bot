# Dedicated permanent HTTP MCP service; never use for the accounting worker.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
numReplicas = 1
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
healthcheckPath = "/.well-known/oauth-protected-resource/mcp"
healthcheckTimeout = 30
overlapSeconds = 0
drainingSeconds = 5
